name: racehunter

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: racehunter
      POSTGRES_USER: racehunter
      POSTGRES_PASSWORD: racehunter_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racehunter -d racehunter"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - racehunter-data:/var/lib/postgresql/data

  target-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: racehunter_target
      POSTGRES_USER: racehunter
      POSTGRES_PASSWORD: racehunter_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racehunter -d racehunter_target"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - target-data:/var/lib/postgresql/data

  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators@sha256:25300472f1fa63b4df0e0c3a5dd67bdc6774b39f6dd440605e520a6d04ae0f26
    command:
      - /bin/bash
      - -c
      - |
        gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=racehunter-local &
        until curl --silent --fail http://127.0.0.1:8085/v1/projects/racehunter-local/topics >/dev/null; do sleep 1; done
        curl --silent --fail --request PUT http://127.0.0.1:8085/v1/projects/racehunter-local/topics/racehunter-work
        curl --silent --fail --request PUT http://127.0.0.1:8085/v1/projects/racehunter-local/topics/racehunter-dead-letter
        curl --silent --fail --request PUT --header 'Content-Type: application/json' --data '{"topic":"projects/racehunter-local/topics/racehunter-work","pushConfig":{"pushEndpoint":"http://worker:8080/internal/pubsub/push"},"ackDeadlineSeconds":30}' http://127.0.0.1:8085/v1/projects/racehunter-local/subscriptions/racehunter-worker
        wait
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--fail", "http://127.0.0.1:8085/v1/projects/racehunter-local/topics"]
      interval: 2s
      timeout: 2s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/RaceHunter.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RaceHunter: Host=postgres;Port=5432;Database=racehunter;Username=racehunter;Password=racehunter_local
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PubSub__ProjectId: racehunter-local
      PubSub__TopicId: racehunter-work
      PubSub__DeadLetterTopicId: racehunter-dead-letter
      PubSub__UseEmulator: "true"
      Worker__BaseUrl: http://worker:8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      pubsub:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/RaceHunter.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RaceHunter: Host=postgres;Port=5432;Database=racehunter;Username=racehunter;Password=racehunter_local
      ReferenceTarget__BaseUrl: http://reference-target:8080
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PubSub__ProjectId: racehunter-local
      PubSub__TopicId: racehunter-work
      PubSub__DeadLetterTopicId: racehunter-dead-letter
      PubSub__UseEmulator: "true"
      PubSub__RequireAuthentication: "false"
      ReferenceTarget__DemoControlKey: local-demo-only
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s
    depends_on:
      postgres:
        condition: service_healthy
      reference-target:
        condition: service_healthy
      pubsub:
        condition: service_healthy

  reference-target:
    build:
      context: .
      dockerfile: src/RaceHunter.ReferenceTarget/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ReferenceTarget: Host=target-postgres;Port=5432;Database=racehunter_target;Username=racehunter;Password=racehunter_local
      DemoControl__Key: local-demo-only
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    depends_on:
      target-postgres:
        condition: service_healthy

volumes:
  racehunter-data:
  target-data:
