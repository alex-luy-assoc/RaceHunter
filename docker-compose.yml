name: racehunter

services:
  postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: racehunter
      POSTGRES_USER: racehunter
      POSTGRES_PASSWORD: racehunter_local
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racehunter -d racehunter"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - racehunter-data:/var/lib/postgresql/data

  target-postgres:
    image: postgres:17-alpine@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73
    environment:
      POSTGRES_DB: racehunter_target
      POSTGRES_USER: racehunter
      POSTGRES_PASSWORD: racehunter_local
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U racehunter -d racehunter_target"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - target-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: src/RaceHunter.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__RaceHunter: Host=postgres;Port=5432;Database=racehunter;Username=racehunter;Password=racehunter_local
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/RaceHunter.Worker/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 5s

  reference-target:
    build:
      context: .
      dockerfile: src/RaceHunter.ReferenceTarget/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__ReferenceTarget: Host=target-postgres;Port=5432;Database=racehunter_target;Username=racehunter;Password=racehunter_local
      DemoControl__Key: local-demo-only
    ports:
      - "8082:8080"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 2s
      timeout: 2s
      retries: 20
      start_period: 10s
    depends_on:
      target-postgres:
        condition: service_healthy

volumes:
  racehunter-data:
  target-data:
