name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.400
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            src/RaceHunter.Web/package-lock.json
            tests/RaceHunter.AcceptanceTests/package-lock.json
      - name: Restore .NET
        run: dotnet restore RaceHunter.slnx
      - name: Build .NET
        run: dotnet build RaceHunter.slnx -c Release --no-restore
      - name: Test architecture and unit suites
        run: dotnet test RaceHunter.slnx -c Release --no-build --filter "FullyQualifiedName!~IntegrationTests"
      - name: Install and test web
        run: |
          npm ci --prefix src/RaceHunter.Web
          npm test --prefix src/RaceHunter.Web
          npm run lint --prefix src/RaceHunter.Web
          npm run build --prefix src/RaceHunter.Web
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Audit public Git history
        shell: pwsh
        run: ./scripts/audit-public-release.ps1
